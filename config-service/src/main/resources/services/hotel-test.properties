# SPRING DATASOURCE CONFIGURATION

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver

# HIKARI CONNECTION POOL CONFIGURATION

spring.datasource.hikari.pool-name=testConnection
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=true

# JPA / HIBERNATE CONFIGURATION

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# DATABASE INITIALIZATION

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data_1.sql,classpath:data_2.sql,classpath:data_3.sql,classpath:data_4.sql,classpath:data_5.sql,classpath:data_6.sql

# SECURITY CONFIGURATION

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

