
#Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8081/eureka/
eureka.client.eureka-server-connect-timeout-seconds=10
eureka.client.eureka-server-read-timeout-seconds=15
eureka.instance.prefer-ip-address=true

# Actuator settings  http://localhost:8084/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

#Logging
logging.level.com.asv=info
logging.level.root=info
logging.file.name=logs/tg-app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

#TG bot
#telegram.bot.token=${TG_TOKEN}
#telegram.bot.username=${TG_NAME}

# SPRING DATASOURCE CONFIGURATION

spring.datasource.url=jdbc:postgresql://localhost:5432/telegram_bot_client_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIKARI CONNECTION POOL CONFIGURATION

spring.datasource.hikari.pool-name=testConnection
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
#replace for 60000 for safety on prod
spring.datasource.hikari.leak-detection-threshold=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=true

# JPA / HIBERNATE CONFIGURATION

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

#FEIGN

feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

#BOT
telegram.bot.token=${TG_TOKEN}
telegram.bot.username=${TG_BOT_NAME}